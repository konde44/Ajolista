<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><title>AjoLista 2.0</title><style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#0f172a;--at:#fff;--good:#166534;--goodbg:#dcfce7;--warn:#92400e;--warnbg:#fef3c7;--danger:#991b1b;--dangerbg:#fee2e2}body.dark{--bg:#0b1220;--card:#111827;--text:#f9fafb;--muted:#9ca3af;--line:#263244;--accent:#f8fafc;--at:#0f172a;--good:#86efac;--goodbg:#123524;--warn:#fcd34d;--warnbg:#3a2b0d;--danger:#fecaca;--dangerbg:#3a1414}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}header{position:sticky;top:0;z-index:10;background:var(--accent);color:var(--at);padding:calc(10px + env(safe-area-inset-top)) 14px 12px}.top{max-width:700px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900}.icon,.nav{border:0;border-radius:12px;padding:10px 12px;background:#ffffff22;color:var(--at);font-weight:800}.datebar{max-width:700px;margin:10px auto 0;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}.center{text-align:center}.day{font-size:18px;font-weight:900}.full{font-size:12px;opacity:.8}.today{display:block;margin:8px auto 0;border:0;background:transparent;color:var(--at);font-weight:800}main{max-width:700px;margin:auto;padding:12px 12px 110px}.label,.sect{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:9px 3px}.next,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.next{border:2px solid var(--accent);box-shadow:0 4px 18px #00000012}.time{font-size:25px;font-weight:900}.next .time{font-size:34px}.name{font-size:18px;font-weight:800;margin-top:2px}.route{margin-top:6px}.note{font-size:14px;color:var(--muted);margin-top:7px;white-space:pre-wrap}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.pill{background:var(--card);border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:800;background:var(--line);color:var(--text)}.primary{background:var(--accent);color:var(--at)}.good{background:var(--goodbg);color:var(--good)}.warn{background:var(--warnbg);color:var(--warn)}.danger{background:var(--dangerbg);color:var(--danger)}.done{opacity:.58}.fab{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:676px;margin:auto;border:0;border-radius:16px;padding:16px;background:var(--accent);color:var(--at);font-size:17px;font-weight:900;box-shadow:0 8px 25px #0004}.empty{text-align:center;color:var(--muted);padding:38px 20px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{width:100%;max-width:700px;margin:auto;background:var(--card);color:var(--text);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheet h2{margin:0 0 6px}.help{margin:0 0 10px;color:var(--muted);font-size:13px}label{display:block;font-size:12px;font-weight:900;margin:12px 0 5px;color:var(--muted);text-transform:uppercase}input,textarea{width:100%;padding:13px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px}textarea{min-height:82px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ma{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.ma button{padding:14px}.setting{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}.small{font-size:12px;color:var(--muted)}@media(max-width:430px){.grid{grid-template-columns:1fr}.actions .btn{flex:1 1 auto}}
</style></head><body><header><div class="top"><div class="brand">🚕 AjoLista 2.0</div><button class="icon" onclick="openSettings()">⚙️</button></div><div class="datebar"><button class="nav" onclick="changeDay(-1)">‹</button><div class="center"><div class="day" id="dayName"></div><div class="full" id="fullDate"></div></div><button class="nav" onclick="changeDay(1)">›</button></div><button class="today" onclick="goToday()">Tänään</button></header><main><div id="nextWrap"></div><div class="summary" id="summary"></div><div id="list"></div></main><button class="fab" onclick="openRideForm()">＋ LISÄÄ KYYTI</button>
<div class="modal" id="rideModal"><div class="sheet"><h2 id="rideTitle">Uusi kyyti</h2><p class="help">Kyyti tallentuu valitulle päivälle ja järjestyy kellonajan mukaan.</p><input type="hidden" id="editId"><div class="grid"><div><label>Kellonaika</label><input id="time" type="time"></div><div><label>Asiakas / kyyti</label><input id="name" placeholder="Esim. Matti / Koulukyyti"></div></div><label>Lähtö</label><input id="from" placeholder="Esim. Ruokolahti"><label>Määränpää</label><input id="to" placeholder="Esim. Imatra"><label>Lisätiedot</label><textarea id="note" placeholder="Esim. Kela, odotus, paluu..."></textarea><div class="ma"><button class="btn" onclick="closeRideForm()">Peruuta</button><button class="btn primary" onclick="saveRide()">Tallenna</button></div></div></div>
<div class="modal" id="settingsModal"><div class="sheet"><h2>Asetukset</h2><div class="setting"><b>🌙 Tumma tila</b><div class="small">Sopii ilta- ja yöajoon.</div><button class="btn" style="margin-top:8px" onclick="toggleDark()">Vaihda</button></div><div class="setting"><b>💾 Varmuuskopio</b><div class="small">Lataa kaikki ajot tiedostona.</div><button class="btn" style="margin-top:8px" onclick="exportData()">Lataa varmuuskopio</button></div><div class="setting"><b>📥 Palauta varmuuskopio</b><input id="importFile" type="file" accept="application/json" onchange="importData(event)"></div><div class="setting"><b>🗑️ Tyhjennä valittu päivä</b><div class="small">Poistaa vain nyt näkyvän päivän ajot.</div><button class="btn danger" style="margin-top:8px" onclick="clearSelectedDay()">Tyhjennä päivä</button></div><div class="ma"><button class="btn primary" style="grid-column:1/-1" onclick="closeSettings()">Sulje</button></div></div></div>
<script>
const KEY='ajolista-v2',LEGACY='ajolista-v1'; const $=id=>document.getElementById(id); function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')} let selectedDate=iso(new Date()); function load(){let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){} if(!s)s={days:{},settings:{dark:false}}; if(!s.days)s.days={};if(!s.settings)s.settings={dark:false};try{let l=JSON.parse(localStorage.getItem(LEGACY)||'[]');if(Array.isArray(l)&&l.length&&!Object.keys(s.days).length){s.days[selectedDate]=l;localStorage.removeItem(LEGACY);localStorage.setItem(KEY,JSON.stringify(s))}}catch(e){}return s} let state=load(); function save(){localStorage.setItem(KEY,JSON.stringify(state))} function rides(){return state.days[selectedDate]||[]} function setRides(r){state.days[selectedDate]=r;save()} function dObj(s){let[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)} function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function header(){let d=dObj(selectedDate),t=iso(new Date()),n=d.toLocaleDateString('fi-FI',{weekday:'long'});n=n[0].toUpperCase()+n.slice(1);$('dayName').textContent=(selectedDate===t?'Tänään • ':'')+n;$('fullDate').textContent=d.toLocaleDateString('fi-FI',{day:'numeric',month:'long',year:'numeric'})} function changeDay(x){let d=dObj(selectedDate);d.setDate(d.getDate()+x);selectedDate=iso(d);render()} function goToday(){selectedDate=iso(new Date());render()}
function render(){header();let all=[...rides()].sort((a,b)=>a.time.localeCompare(b.time));state.days[selectedDate]=all;save();let open=all.filter(r=>!r.done),done=all.filter(r=>r.done);$('summary').innerHTML=`<div class="pill">${all.length} ajoa</div><div class="pill">${open.length} jäljellä</div><div class="pill">${done.length} ajettu</div>`;$('nextWrap').innerHTML=open.length?`<div class="label">Seuraava ajo</div><div class="next"><div class="time">${open[0].time}</div><div class="name">${esc(open[0].name||'Kyyti')}</div><div class="route">${esc(open[0].from)} → ${esc(open[0].to)}</div>${open[0].note?`<div class="note">📝 ${esc(open[0].note)}</div>`:''}<div class="actions"><button class="btn primary" onclick="toggleDone('${open[0].id}')">✓ Merkitse ajetuksi</button><button class="btn" onclick="editRide('${open[0].id}')">Muokkaa</button></div></div>`:'';if(!all.length){$('list').innerHTML='<div class="empty"><div style="font-size:44px">🚕</div><h3>Ei ajoja tälle päivälle</h3><p>Lisää ensimmäinen kyyti.</p></div>';return}let h='';if(open.length)h+='<div class="sect">Tulevat ajot</div>'+open.map(card).join('');if(done.length)h+='<div class="sect">Ajetut</div>'+done.map(card).join('');$('list').innerHTML=h}
function card(r){return `<div class="card ${r.done?'done':''}"><div class="time">${r.time}</div><div class="name">${esc(r.name||'Kyyti')}</div><div class="route">${esc(r.from)} → ${esc(r.to)}</div>${r.note?`<div class="note">📝 ${esc(r.note)}</div>`:''}<div class="actions"><button class="btn ${r.done?'good':'primary'}" onclick="toggleDone('${r.id}')">${r.done?'↩ Palauta':'✓ Ajettu'}</button><button class="btn" onclick="editRide('${r.id}')">Muokkaa</button><button class="btn warn" onclick="makeReturn('${r.id}')">↔ Paluu</button><button class="btn" onclick="copyRide('${r.id}')">⧉ Kopioi</button><button class="btn danger" onclick="removeRide('${r.id}')">Poista</button></div></div>`}
function openRideForm(id){$('rideModal').style.display='flex';$('editId').value=id||'';$('rideTitle').textContent=id?'Muokkaa kyytiä':'Uusi kyyti';let r=rides().find(x=>x.id===id);['time','name','from','to','note'].forEach(k=>$(k).value=r?(r[k]||''):'')} function closeRideForm(){$('rideModal').style.display='none'} function saveRide(){let id=$('editId').value||Date.now()+'-'+Math.random().toString(16).slice(2),old=rides().find(r=>r.id===id),r={id,time:$('time').value,name:$('name').value.trim(),from:$('from').value.trim(),to:$('to').value.trim(),note:$('note').value.trim(),done:old?old.done:false};if(!r.time){alert('Anna kellonaika.');return}if(!r.from||!r.to){alert('Anna lähtö ja määränpää.');return}setRides(old?rides().map(x=>x.id===id?r:x):[...rides(),r]);closeRideForm();render()} function editRide(id){openRideForm(id)} function toggleDone(id){setRides(rides().map(r=>r.id===id?{...r,done:!r.done}:r));render()} function removeRide(id){if(confirm('Poistetaanko ajo?')){setRides(rides().filter(r=>r.id!==id));render()}}
function makeReturn(id){let r=rides().find(x=>x.id===id);if(!r)return;let time=prompt('Paluukyydin kellonaika (HH:MM)',r.time||'');if(time===null)return;setRides([...rides(),{id:Date.now()+'-'+Math.random().toString(16).slice(2),time,name:(r.name||'Kyyti')+' – paluu',from:r.to,to:r.from,note:r.note||'',done:false}]);render()} function copyRide(id){let r=rides().find(x=>x.id===id);if(!r)return;let target=prompt('Kopioi päivälle (VVVV-KK-PP)',selectedDate);if(!target)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(target)){alert('Kirjoita päivä muodossa VVVV-KK-PP.');return}state.days[target]=[...(state.days[target]||[]),{...r,id:Date.now()+'-'+Math.random().toString(16).slice(2),done:false}];save();alert('Kyyti kopioitu päivälle '+target)}
function openSettings(){$('settingsModal').style.display='flex'} function closeSettings(){$('settingsModal').style.display='none'} function toggleDark(){state.settings.dark=!state.settings.dark;save();applyTheme()} function applyTheme(){document.body.classList.toggle('dark',!!state.settings.dark)} function clearSelectedDay(){if(confirm('Poistetaanko kaikki valitun päivän ajot?')){delete state.days[selectedDate];save();closeSettings();render()}} function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='AjoLista-varmuuskopio-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove()} function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.days)throw 0;if(confirm('Korvataanko nykyiset tiedot varmuuskopiolla?')){state=x;if(!state.settings)state.settings={dark:false};save();applyTheme();render();alert('Varmuuskopio palautettu.')}}catch(_){alert('Tiedosto ei ole kelvollinen AjoLista-varmuuskopio.')}e.target.value=''};r.readAsText(f)} applyTheme();render();
</script></body></html>
